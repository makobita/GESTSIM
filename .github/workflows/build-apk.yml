name: Compilar y publicar APK

# Compilador automático: cada vez que subes cambios a main/master
# compila el APK, le pone un número de versión nuevo y lo publica como "Release".
# La app instalada mira esa Release para actualizarse.
on:
  push:
    branches: [ main, master ]
    paths-ignore: [ 'README.md', 'LEEME.md' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Motor 3D (Three.js) dentro de la app
        run: curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o app/src/main/assets/three.min.js

      - name: Clave de firma propia (opcional, desde Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/firma.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/firma.jks" >> "$GITHUB_ENV"
            echo "Usando la clave de los Secrets"
          else
            echo "Usando keystore/gestsim.jks del repositorio"
          fi

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -z "$KEYSTORE_PASSWORD" ] && unset KEYSTORE_PASSWORD
          [ -z "$KEY_ALIAS" ] && unset KEY_ALIAS
          [ -z "$KEY_PASSWORD" ] && unset KEY_PASSWORD
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk GESTSIM.apk

      - name: Guardar APK en la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: GESTSIM-v1.0.${{ github.run_number }}
          path: GESTSIM.apk

      - name: Publicar Release (la que mira la app para actualizarse)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: GESTSIM 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message || 'Compilación manual' }}
          files: GESTSIM.apk
          make_latest: true
